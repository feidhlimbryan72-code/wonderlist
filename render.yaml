services:
  - type: web
    name: wonderlist-clone
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        fromInput: supabaseUrl
      - key: VITE_SUPABASE_ANON_KEY
        fromInput: supabaseAnonKey
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

parameters:
  - key: supabaseUrl
    description: The URL of your Supabase project (e.g., https://xyz.supabase.co)
    required: true
  - key: supabaseAnonKey
    description: The anonymous public API key of your Supabase project
    required: true

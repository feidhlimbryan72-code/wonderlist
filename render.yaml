services:
  - type: web
    name: task-tracker
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: "https://your-project.supabase.co"
      - key: VITE_SUPABASE_ANON_KEY
        value: "your-anon-key-here"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

services:
  - type: web
    name: wonderlist-clone
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: "https://your-project.supabase.co"
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        value: "your-anon-key-here"
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
